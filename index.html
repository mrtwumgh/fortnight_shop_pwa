<!doctype html>
<html lang="en"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Fortnight Shop</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#1B2340">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
:root{--bg:#ECEFE9;--ink:#1B2340;--mute:#5E6783;--line:#CBD1C8;--gold:#E3A21A;--ok:#1F7A57;--bad:#C2402A}
@media(prefers-color-scheme:dark){:root{--bg:#10162B;--ink:#E9ECF5;--mute:#98A1BD;--line:#2A3354}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 "Avenir Next","Segoe UI",Roboto,system-ui,sans-serif;padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
main{max-width:560px;margin:0 auto;padding:20px 18px 48px}
h1{font-size:15px;font-weight:700;margin:0}
#when{margin:2px 0 24px;color:var(--mute);font-size:14px}
section{margin:0 0 26px}
.rn{margin:0;color:var(--mute);font-size:14px}
h2{font-size:28px;line-height:1.1;margin:2px 0 10px;font-weight:800}
.big{font-size:44px;line-height:1;font-weight:800;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.mt{position:relative;height:10px;background:var(--line);border-radius:5px;margin:12px 0 4px;overflow:hidden}
.mt i{position:absolute;inset:0 auto 0 0}
.mt u{position:absolute;top:0;bottom:0;left:80%;width:2px;background:var(--ink);opacity:.55}
.mk{font-size:13px;color:var(--mute);margin:0 0 14px}
ul{list-style:none;margin:0;padding:0;border-top:1px solid var(--line)}
li{display:flex;gap:12px;align-items:flex-start;padding:14px 0;border-bottom:1px solid var(--line)}
.ck{flex:none;width:30px;height:30px;border-radius:50%;border:2px solid var(--ink);background:none;position:relative}
.ck[aria-pressed=true]{background:var(--ok);border-color:var(--ok)}
.ck[aria-pressed=true]::after{content:"";position:absolute;left:9px;top:3px;width:7px;height:13px;border:solid #fff;border-width:0 3px 3px 0;transform:rotate(45deg)}
.tx{flex:1;min-width:0}
.tx b{display:block;font-weight:650}
.tx span{display:block;font-size:14px;color:var(--mute)}
li.b .tx b{text-decoration:line-through;color:var(--mute)}
li.x{opacity:.55}
.pr{flex:none;background:none;border:0;border-bottom:1px dashed var(--mute);font:inherit;font-weight:700;color:var(--ink);padding:2px 0;min-height:32px;font-variant-numeric:tabular-nums}
.lk{background:none;border:0;padding:6px 0;font:inherit;font-size:13px;color:var(--mute);text-decoration:underline}
button:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
details{border-top:1px solid var(--line);padding:12px 0}
summary{font-weight:650;cursor:pointer}
details ul{margin-top:8px}
li.ln{justify-content:space-between;align-items:baseline;padding:10px 0}
.ln small{display:block;color:var(--mute);font-size:13px}
.sm{font-size:13px;color:var(--mute);margin:10px 0 0}
</style></head>
<body><main>
<h1>Fortnight Shop</h1>
<p id="when">&nbsp;</p>
<div id="app"></div>
<div id="rem"></div>
</main>
<script>
const CAP=500,GOAL=400,W={s:"Buy locally",c:"Temu",a:"Temu",h:"Temu"},N={s:"skin",c:"clothes",a:"accessories",h:"home"};
/* [category, item, estimated GH₵, note] - prices are estimates; tap a price in the app to correct it */
const R=[
["Skin basics",[["s","CeraVe Hydrating Cleanser, 236 ml",150,"Gentle, non-foaming. Use morning and night."],["s","Face sunscreen SPF 50 (Biore UV Aqua Rich or Nivea Sun)",150,"Every morning. Stops acne marks from darkening."],["s","Body wash for dry skin (Dove or Nivea Creme)",90,"Skip heavily scented or foaming gels."]]],
["Moisturisers",[["s","CeraVe Daily Moisturizing Lotion, 355 ml",270,"Face and neck. Fragrance-free and non-comedogenic."],["s","Body lotion (Vaseline Intensive Care or Nivea)",100,"Apply within 3 minutes of showering."]]],
["Work shirts and chinos",[["c","2 short-sleeve button shirts, oxford or linen blend",170,"Small standard or camp collar. Fit the chest, not loose."],["c","Straight-leg chinos, khaki or navy",140,"Straight legs balance a slim frame."],["a","Leather belt, black or brown",50,"Worn even with untucked shirts."]]],
["Serums",[["s","Hyaluronic acid serum (The Ordinary 2% + B5)",180,"Apply to damp skin, then moisturiser. Start with this one."],["s","Niacinamide serum (The Ordinary 10% + Zinc)",180,"Add it 2 weeks after the HA serum, 3 nights a week at first."]]],
["Home cleaning starter",[["h","Colour-safe laundry detergent pods",110,"For the washing machine."],["h","Microfibre cloths, 12-pack",50,"Dusting, surfaces, screens."],["h","Scrub brush set for kitchen and bathroom",60,""],["h","Toilet brush with holder",60,""]]],
["Casual tees and jeans",[["c","3 heavyweight cotton tees (white, black, olive)",150,"Thicker cotton holds shape on a lean frame."],["c","Straight-leg jeans or cargo trousers",170,"Avoid skinny cuts."],["c","Ankle socks, 6 pairs",50,""]]],
["Sneakers",[["c","Minimal sneakers, white or off-white",250,"Check photo reviews and sizing notes."],["a","Sneaker cleaning kit",50,""]]],
["Home and sleep top-up",[["c","2 soft lounge tees",80,"Skip anything you already own."],["c","2 pairs of sleep shorts",90,""],["c","Slides",60,""]]],
["Accessories",[["a","Sunglasses, UV400, round or soft-square",60,"Softer frames suit a slim face."],["a","Thin silver chain, 2 to 3 mm",60,"A slim width suits a slender neck."],["a","Minimal bracelet",40,""],["a","Plain cap",45,""],["a","Slim wallet",70,""]]],
["Smart outfit for interviews and meetings",[["c","Slim-fit oxford shirt, white or light blue",110,"Wear untucked or tucked."],["c","Dark tailored trousers",170,""],["c","Dark socks, 3 pairs",40,""]]],
["Smart shoes and bag",[["c","Loafers or derby shoes, black or brown",200,""],["a","Sling or crossbody bag",100,"Fits a phone, charger and notebook."]]],
["Events outfit",[["c","Fitted kaftan or African-print shirt",150,"Weddings, church, funerals."],["c","Matching or neutral trousers",130,""]]],
["Gym kit",[["c","2 breathable training tees",80,""],["c","2 training shorts",80,""]]],
["Home cleaning round two",[["h","Spin mop and bucket",200,""],["h","Foldable laundry hamper",80,""],["h","Lint roller or clothes brush",30,""]]],
["Skincare refill",[["s","Whichever is running low: cleanser, sunscreen or moisturiser",300,"Sunscreen usually runs out first."]]]
];
let S={},cfg=null;
try{S=JSON.parse(localStorage.getItem("fsp")||"{}")}catch(e){}
const $=s=>document.querySelector(s);
const put=()=>{try{localStorage.setItem("fsp",JSON.stringify(S))}catch(e){}};
const gh=n=>"GH₵ "+Math.round(n).toLocaleString("en-GB");
const done=i=>R[i][1].every((_,j)=>{const s=S[i+"."+j];return s&&(s.b||s.x)});
const sum=i=>R[i][1].reduce((t,it,j)=>{const s=S[i+"."+j]||{};return s.x?t:t+(s.p!=null?s.p:it[2])},0);
const cats=i=>[...new Set(R[i][1].map(x=>N[x[0]]))].join(", ");
const ln=i=>`<li class="ln"><span>Round ${i+1}: ${R[i][0]}<small>${cats(i)}</small></span><b>${gh(sum(i))}</b></li>`;
function row(i,j){
  const it=R[i][1][j],k=i+"."+j,s=S[k]||{},p=s.p!=null?s.p:it[2];
  return `<li class="${s.b?"b ":""}${s.x?"x":""}"><button class="ck" data-a="b" data-k="${k}" aria-pressed="${!!s.b}" aria-label="Bought: ${it[1]}"></button><div class="tx"><b>${it[1]}</b>${it[3]?`<span>${it[3]}</span>`:""}<span>${W[it[0]]}${s.x?", skipped":""} <button class="lk" data-a="x" data-k="${k}">${s.x?"Undo skip":"Skip, I own this"}</button></span></div><button class="pr" data-a="p" data-k="${k}" aria-label="Edit price">${gh(p)}</button></li>`;
}
function meter(t){
  const c=t>CAP?"var(--bad)":t>GOAL?"var(--gold)":"var(--ok)";
  return `<div class="mt" role="img" aria-label="${gh(t)} against a ${gh(GOAL)} target and ${gh(CAP)} cap"><i style="width:${Math.min(t/CAP,1)*100}%;background:${c}"></i><u></u></div><p class="mk">Target ${gh(GOAL)} (the line). Hard cap ${gh(CAP)} (the end).</p>`;
}
function draw(){
  const cur=R.findIndex((_,i)=>!done(i));let h="";
  if(cur<0)h="<section><h2>Every round is done</h2></section>";
  else{
    const t=sum(cur),up=R.map((_,i)=>i).filter(i=>i>cur);
    h=`<section><p class="rn">Round ${cur+1} of ${R.length}</p><h2>${R[cur][0]}</h2><div class="big">${gh(t)}</div>${meter(t)}<ul>${R[cur][1].map((_,j)=>row(cur,j)).join("")}</ul><p class="sm">Tick an item when you buy it. Tap a price to change it to what you paid.</p></section>`;
    if(up.length)h+=`<details><summary>Coming up (${up.length})</summary><ul>${up.map(ln).join("")}</ul></details>`;
  }
  const dn=R.map((_,i)=>i).filter(done);
  if(dn.length)h+=`<details><summary>Bought (${dn.length})</summary><ul>${dn.map(ln).join("")}</ul></details>`;
  h+=`<p class="sm"><button class="lk" data-a="r">Reset all progress</button></p>`;
  $("#app").innerHTML=h;
}
function when(){
  if(!cfg)return;
  const a=new Date(cfg.anchor+"T00:00:00"),t=new Date();t.setHours(0,0,0,0);
  const d=Math.round((t-a)/864e5),n=d>0?Math.ceil(d/14):0;
  const nx=new Date(a.getTime()+n*14*864e5),g=Math.round((nx-t)/864e5);
  const f=x=>x.toLocaleDateString("en-GB",{weekday:"short",day:"numeric",month:"short"});
  $("#when").textContent="Next shop day: "+f(nx)+(g==0?" (today)":g==1?" (tomorrow)":" (in "+g+" days)");
  $("#rem").innerHTML=`<details><summary>Reminders</summary><p class="sm">Install the ntfy app and subscribe to <b>${cfg.topic}</b>. A reminder arrives every 14 days, starting ${f(a)}.</p></details>`;
}
document.addEventListener("click",e=>{
  const b=e.target.closest("button[data-a]");if(!b)return;
  const a=b.dataset.a,k=b.dataset.k;
  if(a=="r"){if(confirm("Clear all ticks and prices?")){S={};put();draw()}return}
  const it=R[k.split(".")[0]][1][k.split(".")[1]],s=S[k];
  if(a=="b"){if(s&&s.b)delete S[k];else S[k]={b:1,p:s&&s.p!=null?s.p:it[2]}}
  if(a=="x"){if(s&&s.x)delete S[k];else S[k]={x:1}}
  if(a=="p"){const v=prompt("Price in GH₵",s&&s.p!=null?s.p:it[2]);if(v===null)return;const n=parseFloat(v);if(isNaN(n))return;S[k]={...(s||{}),p:n}}
  put();draw();
});
draw();
fetch("config.json",{cache:"no-store"}).then(r=>r.json()).then(c=>{cfg=c;when()}).catch(()=>{});
if("serviceWorker" in navigator)navigator.serviceWorker.register("sw.js");
</script></body></html>
