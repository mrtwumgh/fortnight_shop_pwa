name: Fortnight reminder
on:
  schedule:
    - cron: "0 7 * * *"   # 07:00 UTC = 07:00 in Accra
  workflow_dispatch:
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Send reminder on shop days
        run: |
          ANCHOR=$(jq -r .anchor config.json)
          TOPIC=$(jq -r .topic config.json)
          DAYS=$(( ( $(date -u +%s) - $(date -u -d "$ANCHOR" +%s) ) / 86400 ))
          if { [ "$DAYS" -ge 0 ] && [ $(( DAYS % 14 )) -eq 0 ]; } || [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            curl -s -H "Title: Shopping day" -H "Tags: moneybag" \
              -H "Click: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/" \
              -d "Open Fortnight Shop and buy this round." "https://ntfy.sh/$TOPIC"
          fi
